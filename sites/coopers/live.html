<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Replaced from sites.json on load; this is the fallback for a visitor
         whose script never runs. -->
    <title>BC Free Flight Live Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../../styles/live.css">
</head>
<body data-site="coopers" data-view="fit" data-weather="shown">
<div id="video-container">
    <div class="video-mask">
        <!-- src is built from sites.json by live.js -->
        <iframe id="video-player"
                title="Live stream"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
        </iframe>
    </div>
</div>

<div id="weather-dock">
    <div class="dock-bar">
        <span class="dock-side"></span>

        <button class="weather-handle" type="button" id="toggle-weather" aria-pressed="true"
                aria-controls="weather-overlay">
            <i class="material-symbols-outlined" aria-hidden="true">expand_more</i>
            <span class="visually-hidden">Hide the weather readings</span>
        </button>

        <span class="dock-side dock-side--end">
            <button class="control" type="button" id="toggle-view" aria-pressed="false">
                <i class="material-symbols-outlined" aria-hidden="true">fit_screen</i>
                <span class="visually-hidden">Show the whole frame</span>
            </button>
        </span>
    </div>

    <div id="weather-overlay">
        <div class="weather-item" id="wind">
            <i class="material-symbols-outlined weather-icon">navigation</i>
            <div class="weather-value">Loading...</div>
            <div class="weather-title">Wind</div>
        </div>

        <div class="weather-item" id="temperature">
            <i class="material-symbols-outlined weather-icon">device_thermostat</i>
            <div class="weather-value">Loading...</div>
            <div class="weather-title">Temperature</div>
        </div>

        <div class="weather-item" id="rainfall">
            <i class="material-symbols-outlined weather-icon">water_drop</i>
            <div class="weather-value">Loading...</div>
            <div class="weather-title">Rainfall</div>
        </div>

    </div>
</div>

<script type="module">
    import live from '../../scripts/live.js';

    document.addEventListener('DOMContentLoaded', async function () {
        await live.initialize();
    });
</script>
</body>
</html>
