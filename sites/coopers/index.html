<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Both are replaced from sites.json on load; these are the fallbacks
         for a visitor whose script never runs. -->
    <title>BC Free Flight</title>
    <meta name="description" content="Live wind, thermal, and weather conditions for BC Free Flight sites.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
    <link rel="stylesheet" href="../../styles/station.css">
</head>

<body data-site="coopers">
<div class="shell">
    <header class="masthead">
        <div>
            <!-- Filled from sites.json by index.js -->
            <h1 class="wordmark" id="site-name"></h1>
            <span class="station-id" id="location"></span>
        </div>

        <div class="masthead-aside">
            <div class="timestamp">
                <span class="label">Observed</span>
                <span id="last-updated">&mdash;</span>
            </div>
            <a class="live-link" href="live" id="live-link">
                <span class="live-dot" aria-hidden="true"></span>
                Live camera
            </a>
        </div>
    </header>

    <main id="weather-data">
        <div class="state">
            <div class="sweep" aria-hidden="true"></div>
            <p class="state-title">Reading the station</p>
            <p>Pulling the latest observation.</p>
        </div>
    </main>
</div>

<script type="module">
    import index from '../../scripts/index.js';

    document.addEventListener('DOMContentLoaded', async function () {
        await index.processWeather();
    });
</script>
</body>
</html>
