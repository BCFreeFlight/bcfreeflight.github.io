<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Freeflight Live Stream</title>
    <meta name="description" content="Live wind, thermal, and weather conditions for BC Free Flight sites.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
    <!-- One optical-size range, shared with every other page, so moving between
         them reuses the font already in cache. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="styles/palette.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/home.css">
</head>
<body>

<main>
    <div class="hero">
        <span class="material-symbols-outlined hero-icon" aria-hidden="true">paragliding</span>
        <h1>BC Freeflight Live Stream</h1>
        <p>Real-time weather and live video for free-flight launch sites in British Columbia</p>
    </div>

    <!-- Built from sites/sites.json by home.js -->
    <div id="sites">
        <p class="empty">Loading sites…</p>
    </div>
</main>

<footer>
    <p>British Columbia, Canada</p>
    <p>
        <a href="/policy.html">Privacy Policy</a>
        &nbsp;&middot;&nbsp;
        <a href="/tos.html">Terms of Service</a>
    </p>
</footer>

<script type="module">
    import home from './scripts/home.js';

    document.addEventListener('DOMContentLoaded', () => home.render());
</script>
</body>
</html>
